<div class="container" style="max-width: 600px;">
  <h2>Add Document</h2>
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <form (ngSubmit)="save()">
    <div class="mb-3">
      <label class="form-label">Project</label>
      <select class="form-select" [(ngModel)]="model.projectId" name="projectId" required>
        <option *ngFor="let p of projects" [value]="p.id">{{ p.name }}</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">File Name</label>
      <input class="form-control" [(ngModel)]="model.fileName" name="fileName" required placeholder="e.g. floor-plan-v2.dwg" />
    </div>
    <div class="mb-3">
      <label class="form-label">Document Type</label>
      <select class="form-select" [(ngModel)]="model.type" name="type" required>
        <option value="FloorPlan">Floor Plan</option>
        <option value="Contract">Contract</option>
        <option value="Invoice">Invoice</option>
        <option value="RenderImage">Render Image</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Notes</label>
      <textarea class="form-control" [(ngModel)]="model.notes" name="notes"></textarea>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="saving">Save</button>
    <a class="btn btn-link" routerLink="/documents">Cancel</a>
  </form>
</div>
