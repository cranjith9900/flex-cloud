<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Documents</h2>
    <a class="btn btn-primary" routerLink="/documents/new">+ Add Document</a>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  <div *ngIf="loading">Loading...</div>

  <table class="table table-striped" *ngIf="!loading && documents.length">
    <thead>
      <tr>
        <th>File Name</th>
        <th>Type</th>
        <th>Project</th>
        <th>Uploaded</th>
        <th>Notes</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of documents">
        <td>{{ d.fileName }}</td>
        <td>{{ d.type }}</td>
        <td>{{ d.projectName }}</td>
        <td>{{ d.uploadedDate | date: 'short' }}</td>
        <td>{{ d.notes }}</td>
        <td>
          <button class="btn btn-sm btn-outline-danger" (click)="deleteDocument(d.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && !documents.length">No documents found.</p>
</div>
