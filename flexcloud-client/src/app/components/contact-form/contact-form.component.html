<div class="container" style="max-width: 600px;">
  <h2>{{ id ? 'Edit Contact' : 'Add Contact' }}</h2>
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <form (ngSubmit)="save()">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input class="form-control" [(ngModel)]="model.fullName" name="fullName" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Company</label>
      <input class="form-control" [(ngModel)]="model.company" name="company" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" [(ngModel)]="model.email" name="email" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input class="form-control" [(ngModel)]="model.phone" name="phone" />
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="saving">Save</button>
    <a class="btn btn-link" routerLink="/contacts">Cancel</a>
  </form>
</div>
