<div class="container" style="max-width: 600px;">
  <h2>{{ id ? 'Edit Lead' : 'Add Lead' }}</h2>
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <form (ngSubmit)="save()">
    <div class="mb-3">
      <label class="form-label">Lead Name</label>
      <input class="form-control" [(ngModel)]="model.name" name="name" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Contact</label>
      <select class="form-select" [(ngModel)]="model.contactId" name="contactId" required>
        <option *ngFor="let c of contacts" [value]="c.id">{{ c.fullName }} ({{ c.company }})</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Source</label>
      <input class="form-control" [(ngModel)]="model.source" name="source" placeholder="Referral, Website, Trade Show..." />
    </div>
    <div class="mb-3">
      <label class="form-label">Status</label>
      <select class="form-select" [(ngModel)]="model.status" name="status" required>
        <option value="New">New</option>
        <option value="Qualified">Qualified</option>
        <option value="Converted">Converted</option>
        <option value="Lost">Lost</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Estimated Value</label>
      <input type="number" step="0.01" class="form-control" [(ngModel)]="model.estimatedValue" name="estimatedValue" required />
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="saving">Save</button>
    <a class="btn btn-link" routerLink="/leads">Cancel</a>
  </form>
</div>
