<div class="container">
  <h2 class="mb-3">Dashboard</h2>
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <div class="row g-3 mb-4" *ngIf="kpis">
    <div class="col-md-2">
      <div class="card text-center p-3">
        <div class="fs-4 fw-bold">{{ kpis.totalLeads }}</div>
        <div class="text-muted">Leads</div>
      </div>
    </div>
    <div class="col-md-2">
      <div class="card text-center p-3">
        <div class="fs-4 fw-bold">{{ kpis.totalProjects }}</div>
        <div class="text-muted">Projects</div>
      </div>
    </div>
    <div class="col-md-2">
      <div class="card text-center p-3">
        <div class="fs-4 fw-bold">{{ kpis.totalDocuments }}</div>
        <div class="text-muted">Documents</div>
      </div>
    </div>
    <div class="col-md-2">
      <div class="card text-center p-3">
        <div class="fs-5 fw-bold">{{ kpis.pipelineValue | currency }}</div>
        <div class="text-muted">Open Pipeline</div>
      </div>
    </div>
    <div class="col-md-2">
      <div class="card text-center p-3">
        <div class="fs-5 fw-bold">{{ kpis.activeProjectBudget | currency }}</div>
        <div class="text-muted">Active Budget</div>
      </div>
    </div>
    <div class="col-md-2">
      <div class="card text-center p-3">
        <div class="fs-4 fw-bold">{{ kpis.conversionRate }}%</div>
        <div class="text-muted">Conversion Rate</div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6">
      <canvas id="leadsChart"></canvas>
    </div>
    <div class="col-md-6">
      <canvas id="projectsChart"></canvas>
    </div>
    <div class="col-12">
      <canvas id="pipelineChart"></canvas>
    </div>
  </div>
</div>
