<div class="container" style="max-width: 600px;">
  <h2>{{ id ? 'Edit Project' : 'Add Project' }}</h2>
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <form (ngSubmit)="save()">
    <div class="mb-3">
      <label class="form-label">Project Name</label>
      <input class="form-control" [(ngModel)]="model.name" name="name" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Client Name</label>
      <input class="form-control" [(ngModel)]="model.clientName" name="clientName" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Contact</label>
      <select class="form-select" [(ngModel)]="model.contactId" name="contactId" required>
        <option *ngFor="let c of contacts" [value]="c.id">{{ c.fullName }} ({{ c.company }})</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Status</label>
      <select class="form-select" [(ngModel)]="model.status" name="status" required>
        <option value="Planning">Planning</option>
        <option value="InProgress">In Progress</option>
        <option value="OnHold">On Hold</option>
        <option value="Completed">Completed</option>
      </select>
    </div>
    <div class="row">
      <div class="col mb-3">
        <label class="form-label">Budget</label>
        <input type="number" step="0.01" class="form-control" [(ngModel)]="model.budget" name="budget" required />
      </div>
      <div class="col mb-3">
        <label class="form-label">Start Date</label>
        <input type="date" class="form-control" [(ngModel)]="model.startDate" name="startDate" required />
      </div>
      <div class="col mb-3">
        <label class="form-label">End Date</label>
        <input type="date" class="form-control" [(ngModel)]="model.endDate" name="endDate" />
      </div>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="saving">Save</button>
    <a class="btn btn-link" routerLink="/projects">Cancel</a>
  </form>
</div>
