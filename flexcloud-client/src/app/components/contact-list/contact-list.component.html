<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Contacts</h2>
    <a class="btn btn-primary" routerLink="/contacts/new">+ Add Contact</a>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  <div *ngIf="loading">Loading...</div>

  <table class="table table-striped" *ngIf="!loading && contacts.length">
    <thead>
      <tr>
        <th>Name</th>
        <th>Company</th>
        <th>Email</th>
        <th>Phone</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of contacts">
        <td>{{ c.fullName }}</td>
        <td>{{ c.company }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phone }}</td>
        <td>
          <a class="btn btn-sm btn-outline-secondary me-1" [routerLink]="['/contacts', c.id, 'edit']">Edit</a>
          <button class="btn btn-sm btn-outline-danger" (click)="deleteContact(c.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && !contacts.length">No contacts found.</p>
</div>
